name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: eu-west-2
  ECR_BACKEND_REPO: task-manager-backend
  ECS_CLUSTER: task-manager-dev
  ECS_BACKEND_SERVICE: task-manager-dev-backend

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: task_manager_test
          POSTGRES_USER: task_manager_test
          POSTGRES_PASSWORD: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend tests ──────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://task_manager_test:task_manager_test@localhost:5432/task_manager_test
          DJANGO_DEBUG: "True"
        run: python manage.py test --verbosity=2
        working-directory: backend

      # ── Frontend lint & typecheck ───────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    outputs:
      backend_image: ${{ steps.tags.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "backend=${ECR_BACKEND_REPO}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${ECR_BACKEND_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.tags.outputs.backend }}
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.tags.outputs.backend_latest }}

  deploy-backend:
    name: Deploy Backend (ECS)
    runs-on: ubuntu-latest
    needs: build-and-push-backend
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_BACKEND_SERVICE \
            --force-new-deployment \
            --query 'service.{status:status,taskDefinition:taskDefinition}'

      - name: Wait for backend deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_BACKEND_SERVICE
          echo "Backend deployment is stable."

      - name: Verify backend deployment
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_BACKEND_SERVICE \
            --query 'services[].{name:serviceName,status:status,desired:desiredCount,running:runningCount}'

  deploy-frontend:
    name: Deploy Frontend (Amplify)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to Amplify
        run: |
          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name master
          echo "Amplify deployment started."

      - name: Wait for Amplify deployment
        run: |
          while true; do
            STATUS=$(aws amplify get-job \
              --app-id ${{ secrets.AMPLIFY_APP_ID }} \
              --branch-name master \
              --job-id $(aws amplify list-jobs \
                --app-id ${{ secrets.AMPLIFY_APP_ID }} \
                --branch-name master \
                --max-results 1 \
                --query 'jobSummaries[0].jobId' \
                --output text) \
              --query 'job.summary.status' \
              --output text)
            echo "Amplify status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "Frontend deployment succeeded."
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "Frontend deployment failed."
              exit 1
            fi
            sleep 30
          done

      - name: Get Amplify URL
        run: |
          AMPLIFY_URL=$(aws amplify get-app \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --query 'app.defaultDomain' \
            --output text)
          echo "Frontend URL: https://master.${AMPLIFY_URL}"
