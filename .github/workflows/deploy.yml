name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: task-manager-backend
  ECR_FRONTEND_REPO: task-manager-frontend
  ECS_CLUSTER: task-manager
  ECS_BACKEND_SERVICE: task-manager-backend
  ECS_FRONTEND_SERVICE: task-manager-frontend

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: task_manager_test
          POSTGRES_USER: task_manager_test
          POSTGRES_PASSWORD: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend tests ──────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://task_manager_test:task_manager_test@localhost:5432/task_manager_test
          DJANGO_DEBUG: "True"
        run: python manage.py test --verbosity=2
        working-directory: backend

      # ── Frontend lint & typecheck ───────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    outputs:
      backend_image: ${{ steps.tags.outputs.backend }}
      frontend_image: ${{ steps.tags.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "backend=${ECR_BACKEND_REPO}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${ECR_FRONTEND_REPO}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${ECR_BACKEND_REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${ECR_FRONTEND_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.tags.outputs.backend }}
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.tags.outputs.backend_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.tags.outputs.frontend }}
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.tags.outputs.frontend_latest }}

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_BACKEND_SERVICE \
            --force-new-deployment \
            --query 'service.{status:status,taskDefinition:taskDefinition}'

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_FRONTEND_SERVICE \
            --force-new-deployment \
            --query 'service.{status:status,taskDefinition:taskDefinition}'

      - name: Wait for backend deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_BACKEND_SERVICE
          echo "Backend deployment is stable."

      - name: Wait for frontend deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_FRONTEND_SERVICE
          echo "Frontend deployment is stable."

      - name: Verify deployment
        run: |
          echo "=== ECS Services ==="
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_BACKEND_SERVICE $ECS_FRONTEND_SERVICE \
            --query 'services[].{name:serviceName,status:status,desired:desiredCount,running:runningCount}'
